# 운영자가 FAQ·공지를 새로 쓰면 여기에도 한 줄 추가한다. 없으면 한국어 원문이 그대로 보인다.
# UTF-8 저장. 줄바꿈은 \n 으로.

# ---- FAQ 카테고리 (DB 에 한국어로 저장된 값 → 표시용)
faq.cat.예약=予約
faq.cat.요금·결제=料金・決済
faq.cat.입·출차=入出庫
faq.cat.항공편=フライト

# ---- FAQ (icn_faq.faq_id)
faq.1.question=駐車予約はいつまでできますか？
faq.1.answer=入庫予定時刻の1時間前まで可能です。
faq.2.question=駐車料金はどのように計算されますか？
faq.2.answer=長期 1日 2,000ウォン / 短期 1日 3,000ウォンです。
faq.7.question=駐車予約は何日前からできますか？
faq.7.answer=利用日の30日前から予約できます。当日でも空きがあればすぐに予約できます。\nメイン画面で入庫日と時刻を選んでからエリアを押すと、その時間帯に空いているスペースだけが表示されます。
faq.8.question=予約型（プラン1）と自由出庫型（プラン2）は何が違いますか？
faq.8.answer=予約型は開始・終了時刻を事前に決め、予約時に料金を全額決済します。帰国便の入力が必須で、P6〜P9エリアで利用します。\n自由出庫型は開始時刻だけ決めて予約金5,000ウォンを決済し、出庫時に実際の利用時間分を精算します。P1〜P5エリアで利用します。
faq.9.question=障がい者用・EV専用スペースは誰が予約できますか？
faq.9.answer=会員登録時に登録した車両の種類が障がい者用車両または電気自動車（燃料電池車を含む）の会員のみ選択できます。\n駐車マップで専用マークのあるスペースが専用スペースで、対象外の会員が押すと案内が表示されます。
faq.10.question=予約をキャンセルしたり時間を変更したいです。
faq.10.answer=利用開始前であれば、ヘッダーの［お知らせ ＞ お問い合わせ］からその他のお問い合わせとして受付してください。担当者が確認後、予約変更またはキャンセル・返金を処理します。\n利用開始後はキャンセルできず、出庫時に実際の利用時間で精算されます。
faq.11.question=予約したスペースに別の車が停まっていたらどうすればいいですか？
faq.11.answer=近くの空いているスペースに一時的に駐車したうえで、［お問い合わせ ＞ スペースの無断占有］から受付してください。スペース番号を添えていただくと担当者がすぐに確認します。\n料金は予約したスペースの基準のまま適用されます。
faq.12.question=エリアごとの駐車料金はいくらですか？
faq.12.answer=長期駐車場（P1・P2）は1時間あたり2,000ウォン、短期駐車場（P3〜P9）は1時間あたり3,000ウォンです。\n自由出庫型は予約金5,000ウォンを先に決済し、出庫時に実際の駐車時間を30分単位で計算して30分あたり4,500ウォンで精算します。
faq.13.question=どの決済方法が使えますか？
faq.13.answer=KakaoPay、NaverPay、クレジットカード、銀行振込に対応しています。決済画面はPortOne経由で開きます。\n決済が完了した場合のみ予約が確定し、決済画面を閉じると予約は保存されません。
faq.14.question=自由出庫型の予約金5,000ウォンは返金されますか？
faq.14.answer=出庫時の精算で、合計料金から予約金5,000ウォンを差し引いた金額のみ追加でお支払いいただきます。\n合計料金が5,000ウォン未満でも差額は返金されません。予約金は最低利用料金とみなします。
faq.15.question=予約型で予定より遅く出庫した場合、料金はどうなりますか？
faq.15.answer=終了予定時刻を超えた時間は30分単位で30分あたり4,500ウォンが加算され、出庫時に現地でお支払いいただきます。\n予定より早く出庫しても、事前に決済した料金は返金されません。
faq.16.question=決済履歴はどこで確認できますか？
faq.16.answer=ログイン後、ヘッダーの名前を押すとマイページに移動します。マイページ ＞ 予約履歴で、予約ごとの決済金額と決済方法を確認できます。
faq.17.question=入庫時に何が必要ですか？
faq.17.answer=予約番号（例: R26-09-0012）と登録した車両番号だけで大丈夫です。入口で予約番号を確認すると入庫処理されます。\n自由出庫型は実際の入庫時刻から料金が計算されます。
faq.18.question=予約した開始時刻より早く着きましたが、入庫できますか？
faq.18.answer=スペースが空いていれば入庫できます。ただし、そのスペースに前の予約が残っている場合は終了までお待ちいただきます。\n予約開始時刻まではスペースが保証されませんので、まず入口の案内デスクにご確認ください。
faq.19.question=出庫はどうすればいいですか？
faq.19.answer=出口で予約番号を確認すると追加料金（自由出庫型の精算分または予約型の超過分）が計算されます。追加料金がある場合は現地で決済してから出庫します。\n追加料金がなければそのまま出庫できます。
faq.20.question=予約時刻に到着できませんでした（ノーショー）。どうなりますか？
faq.20.answer=終了予定時刻までに入庫がない場合、予約は自動的に終了し、決済済みの金額は返金されません。\n予定の変更が事前にわかっている場合は、開始前に［お問い合わせ］からお知らせください。変更処理が可能です。
faq.21.question=予約時になぜフライト情報を入力するのですか？
faq.21.answer=予約型は帰国便の到着時刻を基準に終了時刻を決めます。フライトが欠航した場合、システムがそれを検知して自動的に長期駐車に切り替え、スペースを再割当するためです。\nフライト情報は公共データポータルの仁川空港運航情報を使用しています。
faq.22.question=帰国便が欠航した場合はどうなりますか？
faq.22.answer=欠航が確認されると予約は自動的に再割当され、駐車マップに「欠航 再割当中」と表示されます。利用者が別途連絡する必要はありません。\n延びた駐車時間は出庫時に精算し、欠航による超過分に別途ペナルティはかかりません。
faq.23.question=フライトが検索できません。
faq.23.answer=便名は航空会社コードと数字をつなげて入力します（例: KE001, OZ202）。到着便を基準に照会され、まだ編成されていない先の日付の便は検索できない場合があります。\n検索できない場合は、便名と到着予定時刻を直接入力したうえで［お問い合わせ］からお知らせください。
faq.24.question=片道航空券でも利用できますか？
faq.24.answer=予約型は帰国便の到着時刻が必要なため、往復航空券のみ利用できます。\n片道のお客様は自由出庫型（P1〜P5）でご予約ください。

# ---- 공지사항 (icn_notice.no)
notice.N009.title=仁川空港 第1ターミナル 駐車予約サービス開始
notice.N009.content=仁川国際空港 第1ターミナル駐車場のオンライン予約サービスを開始します。\n\nメイン画面でリアルタイムの駐車状況を確認し、ご希望の日時にP1〜P9エリアのスペースを事前に予約できます。会員登録のうえご利用ください。
notice.N010.title=個人情報保護方針 改定のお知らせ
notice.N010.content=個人情報保護方針を7月15日付で改定します。\n\n主な変更点は、フライト情報（便名・到着予定時刻）の処理目的の追加と保管期間の明記です。改定後の方針はサイト下部の［個人情報保護方針］からご確認いただけます。
notice.N011.title=夏の繁忙期 駐車場混雑のお知らせ
notice.N011.content=7月末から8月中旬の夏休み期間は駐車場が大変混雑します。\n\n出国の2〜3日前までに予約をお済ませください。予約なしでご来場の場合、スペースが見つからないことがあります。リアルタイムの駐車状況はメイン画面でご確認いただけます。
notice.N012.title=障がい者用・環境対応車専用エリアのご利用案内
notice.N012.content=障がい者用スペースと電気自動車・燃料電池車専用スペースは、会員登録時に登録した車両の種類が該当する会員のみ予約できます。\n\n車両の種類を誤って登録した場合はマイページで修正してください。専用スペースを無断で利用した場合、現地で移動をお願いすることがあります。
notice.N013.title=KakaoPay・NaverPay 決済開始
notice.N013.content=予約の決済方法にKakaoPayとNaverPayを追加しました。従来のクレジットカード・銀行振込と合わせて4種類の方法で決済できます。\n\n決済画面はPortOne経由で開き、決済完了後に予約が確定します。
notice.N014.title=欠航 自動再割当サービス開始
notice.N014.content=帰国便が欠航した場合に予約が自動的に長期駐車へ切り替わり、スペースが再割当される「欠航 自動再割当サービス」を開始しました。\n\n予約型でご予約の際は帰国便を正確に入力してください。欠航が確認されると、利用者が連絡しなくてもシステムが処理し、延びた時間は出庫時に精算されます。
notice.N015.title=自由出庫型 精算方式変更のお知らせ
notice.N015.content=9月1日より、自由出庫型（P1〜P5）の出庫精算が30分単位に変わります。\n\n実際の入庫時刻から出庫時刻までを30分単位で切り上げ、30分あたり4,500ウォンで計算し、先に決済した予約金5,000ウォンを差し引いた金額を出庫時にお支払いいただきます。\n8月31日までに入庫した車両は従来の方式で精算します。
notice.N016.title=駐車料金のご案内
notice.N016.content=エリア別の駐車料金をご案内します。\n\n- 長期駐車場 P1・P2 : 1時間あたり2,000ウォン\n- 短期駐車場 P3〜P9 : 1時間あたり3,000ウォン\n- 自由出庫型 : 予約金5,000ウォン ＋ 出庫時に30分あたり4,500ウォンで精算\n\n予約型は予約時に全額決済し、終了予定時刻を超えると30分あたり4,500ウォンが加算されます。
notice.N017.title=システムメンテナンスのお知らせ（9/10 深夜）
notice.N017.content=サービス安定化のため、下記の時間にシステムメンテナンスを行います。\n\n- 日時 : 9月10日（水）02:00 〜 04:00\n- 影響 : 予約・決済サービスの一時停止（入出庫は通常どおり）\n\nメンテナンス中は予約ページにアクセスできません。ご理解をお願いいたします。
notice.N018.title=EV充電エリア拡大のお知らせ
notice.N018.content=P6エリアにEV充電器を4台増設しました。既存の充電器と合わせて、P6エリアで合計9面の充電可能スペースをご利用いただけます。\n\n充電スペースは会員登録時に電気自動車として登録した会員のみ予約でき、充電が終わったら他のお客様のためにスペースを空けてください。
notice.N019.title=お問い合わせサービスのご案内
notice.N019.content=ご利用中の不便や問題をすぐに受け付けられる「お問い合わせ」機能を開設しました。\n\nヘッダーの［お知らせ ＞ お問い合わせ］から種類（スペースの無断占有 / 設備の破損・故障 / 車両の損傷 / 違法駐車 / その他）を選び、内容をご記入いただければ担当者が確認後ご連絡します。\nスペース番号や予約番号を添えていただくと、より早く処理できます。
