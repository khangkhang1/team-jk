<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원정보 - 인천공항 주차관리시스템</title>
<link rel="stylesheet" href="css/c.css">
<link rel="stylesheet" href="css/member.css">
</head>
<body class="resPage">

	<header id="topSearch">
		<a href="Index.html" id="backBtn" title="메인으로" data-i18n="common_back">← 메인으로</a>
		<div id="logo" data-i18n="common_mypage">👤 마이페이지</div>
		<nav id="topNav">
			<button id="langToggleBtn" class="langToggle">🇯🇵 日本語</button>
		</nav>
	</header>

	<div id="memWrap">

		<div id="memTabs">
			<button class="memTab active" data-tab="login" data-i18n="mem_tabLogin">로그인</button>
			<button class="memTab" data-tab="join" data-i18n="mem_tabJoin">회원가입</button>
			<button class="memTab" data-tab="mypage" data-i18n="mem_tabMypage">마이페이지</button>
		</div>

		<!-- 로그인 -->
		<section id="panelLogin" class="memPanel">
			<div class="formCard">
				<div class="formRow">
					<label data-i18n="mem_id">아이디</label>
					<input type="text" id="loginIdInput">
				</div>
				<div class="formRow">
					<label data-i18n="mem_pw">비밀번호</label>
					<input type="password" id="loginPwInput">
				</div>
				<button class="primaryBtn" id="loginSubmitBtn" data-i18n="mem_loginBtn">로그인</button>
			</div>
		</section>

		<!-- 회원가입 -->
		<section id="panelJoin" class="memPanel hidden">
			<div class="formCard">
				<div class="formRow">
					<label data-i18n="mem_id">아이디</label>
					<input type="text" id="joinIdInput">
				</div>
				<div class="formRow">
					<label data-i18n="mem_pw">비밀번호</label>
					<input type="password" id="joinPwInput">
				</div>
				<div class="formRow">
					<label data-i18n="mem_pwCheck">비밀번호 확인</label>
					<input type="password" id="joinPwCheckInput">
				</div>
				<div class="formRow">
					<label data-i18n="mem_name">이름</label>
					<input type="text" id="joinNameInput">
				</div>
				<div class="formRow">
					<label data-i18n="mem_phone">전화번호</label>
					<input type="text" id="joinPhoneInput" placeholder="010-0000-0000">
				</div>

				<fieldset>
					<legend data-i18n="mem_flightSection">✈️ 탑승권(항공편) 정보</legend>
					<div class="formRow">
						<label data-i18n="mem_flightNo">항공편명</label>
						<input type="text" id="joinFlightNoInput" placeholder="예: KE001">
					</div>
					<div class="formRow">
						<label data-i18n="mem_roundtrip">왕복 여부</label>
						<select id="joinRoundtripInput">
							<option value="round" data-i18n="mem_roundtripYes">왕복</option>
							<option value="oneway" data-i18n="mem_roundtripNo">편도 (이용 불가 안내)</option>
						</select>
					</div>
				</fieldset>

				<button class="primaryBtn" id="joinSubmitBtn" data-i18n="mem_joinBtn">가입하기</button>
			</div>
		</section>

		<!-- 마이페이지 -->
		<section id="panelMypage" class="memPanel hidden">
			<div class="formCard" id="myInfoCard">
				<h3 data-i18n="mem_myInfo">내 정보</h3>
				<p>강선구 (test_user) · 010-1234-5678</p>
				<p>✈️ KE001 · 왕복</p>
			</div>

			<h3 class="sectionTitle" data-i18n="mem_myReservations">예약 내역</h3>
			<div class="resCard">
				<div class="resCardHead">
					<span class="resStatus statusInUse" data-i18n="mem_statusInUse">이용중</span>
					<span class="resCardLot">단기주차장 1구역 · 1층 3-2번</span>
				</div>
				<div class="resCardBody">2026-08-30 14:00 ~ 16:00 · 1안(예약형)</div>
				<button class="secondaryBtn" data-i18n="mem_btnExtend">예약 연장</button>
			</div>
			<div class="resCard">
				<div class="resCardHead">
					<span class="resStatus statusBefore" data-i18n="mem_statusBeforeUse">입차 전</span>
					<span class="resCardLot">장기주차장 P1 · 2층 1-4번</span>
				</div>
				<div class="resCardBody">2026-09-02 09:00 ~ (자유출차) · 2안</div>
				<button class="secondaryBtn" data-i18n="mem_btnChange">예약 변경</button>
			</div>
			<div class="resCard done">
				<div class="resCardHead">
					<span class="resStatus statusDone" data-i18n="mem_statusDone">이용 종료</span>
					<span class="resCardLot">단기주차장 2구역 · 1층 4-5번</span>
				</div>
				<div class="resCardBody">2026-08-20 10:00 ~ 12:30 · 최종결제 완료</div>
			</div>
		</section>

	</div>

	<script src="js/jquery-1.8.1.min.js"></script>
	<script src="js/i18n.js"></script>
	<script src="js/member.js"></script>
</body>
</html>
